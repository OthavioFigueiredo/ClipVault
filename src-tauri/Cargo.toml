[package]
name = "clipvault"
version = "1.0.0"
description = "ClipVault - Desktop Clipboard & Screenshot Manager"
authors = ["ClipVault Team"]
license = "MIT"
edition = "2021"

[lib]
name = "clipvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x11rb = { version = "0.13", features = ["xfixes", "allow-unsafe-code"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = "3.4"
uuid = { version = "1.10", features = ["v4", "serde"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
tokio = { version = "1.38", features = ["full"] }
once_cell = "1.19"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
